<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>

<body>
    <section>
        <h2>Registrar producto</h2>
        <form id="formClientes">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Ej. Pedro Gonzales" required>
            <label>Correo</label>
            <input type="email" id="email" placeholder="example@correo.com" required>
            <label>Mensaje</label>
            <textarea id="mensaje" rows="5" placeholder="Escribe tu mensaje" required>
            </textarea>
            <div>
                <button type="submit" id="btn-enviar">
                    Enviar mensaje
                </button>
            </div>
        </form>
        <p id="mostrar_mensaje"></p>
    </section>
    <script type="module" src="js/firebase.js"></script>
</body>
</html>
